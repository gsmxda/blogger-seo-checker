name: Blogger Broken Link Checker

on:
  schedule:
    - cron: '0 0 * * 1' # Har Monday subah 12 baje
  workflow_dispatch: 

jobs:
  run-checker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Link Checker Script
        run: python checker.py
        continue-on-error: true # Script fail ho tab bhi email bhejne wala step chal sake

      - name: Send Email Notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Alert: Broken Links Found on your Blogger Blog!"
          to: ${{ secrets.MAIL_USERNAME }} # Jis email par notification chahiye (aap apna email bhi daal sakte hain)
          from: GitHub Actions
          body: "Hello! Your weekly Blogger SEO check is complete. Please check the attached file for broken links details."
          ạp-path: broken_links.txt
