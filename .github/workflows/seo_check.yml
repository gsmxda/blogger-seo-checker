name: Blogger Broken Link Checker

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch: 

jobs:
  run-checker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Link Checker Script
        run: python checker.py
        continue-on-error: true

      - name: Send Email Notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Blogger SEO & Broken Link Report"
          to: ${{ secrets.MAIL_USERNAME }}
          from: "Blogger Automation"
          body: "Aapke blog ka link check poora ho gaya hai. Details attached file mein hain."
          attachments: broken_links.txt
